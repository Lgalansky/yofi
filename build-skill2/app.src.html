<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yofi - Skill 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Figtree:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F3EB;--card:#FFFFFF;--line:#E6DAC3;--ink:#22263A;--muted:#6A6458;--navy:#1F3157;--navy2:#2D4E86;--wine:#8E1F2F;--gold:#E9B52F;--goldlt:#FFF1C9;--cash:#2F7A4A;--cashlt:#E3F1E7;--red:#B8402C;
--plat:#7FA9C9;--dia:#5B8DEF;--goldt:#D9A21B;--r:18px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,label:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.logo{font:800 1.9rem/1 Fraunces,serif;color:var(--wine)}
.wallet{margin-left:auto;display:flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;background:var(--card);font-weight:800}
.wallet span{display:flex;align-items:center;gap:6px;padding:6px 11px}.wallet span+span{border-left:1.5px solid var(--line)}
.wallet .cash{color:var(--cash)}.wallet .coin{color:#8A6400}
.rv{border:1px dashed #B9AD96;background:none;border-radius:999px;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;color:var(--muted)}
.coinic{display:inline-block;width:1.05em;height:1.05em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3A8,#F3C447 55%,#C88A06);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);vertical-align:-.15em;flex:none}
main{flex:1;padding:14px 16px 100px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs div{max-width:520px;margin:0 auto;display:flex}
.tabs button{flex:1;border:0;background:none;padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tabs svg{width:26px;height:26px}.tabs button[aria-current="page"]{color:var(--navy)}
.tabs button[aria-current="page"] span{position:relative}.tabs button[aria-current="page"] span::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:3px;border-radius:2px;background:var(--navy)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 18px;font-weight:800;background:var(--navy);color:#fff;min-height:48px}
.btn.block{width:100%}.btn.cash{background:var(--cash)}.btn.ghost{background:none;color:var(--navy);border:1.5px solid var(--navy)}.btn.gold{background:var(--gold);color:#2A1C00}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--navy);text-decoration:underline;font-weight:700;padding:8px}
.muted{color:var(--muted)}.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
/* photos */
.pic{position:relative;display:block;overflow:hidden;border-radius:14px;background:#E9DFCD}
.pic img{display:block;width:100%;height:100%;object-fit:cover;transition:filter .35s}
.pic .vig,.pic .warm{position:absolute;inset:0;pointer-events:none;transition:opacity .35s}
.pic .vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(40,30,20,.55) 100%)}
.pic .warm{background:linear-gradient(160deg,rgba(255,190,90,.35),rgba(255,120,60,.05) 60%,rgba(90,40,120,.2));mix-blend-mode:soft-light}
/* vote */
.goal{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%;text-align:left}
.goal .pic{width:52px;height:52px;flex:none;border-radius:50%}
.goal b{display:block;font-size:1rem}.goal small{display:block;color:var(--muted);font-size:.82rem}
.goal .gb{height:8px;border-radius:4px;background:#EFE6D3;margin-top:6px;overflow:hidden}.goal .gb i{display:block;height:100%;background:var(--navy)}
.goal .go{margin-left:auto;flex:none}
.goal.ready{border-color:var(--gold);box-shadow:0 0 0 2px var(--goldlt)}
.vh{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 10px}
.vh h1{font-size:1.75rem}
.streak{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px}
.streak i{width:11px;height:11px;border-radius:50%;background:#DCCFB6}.streak i.on{background:var(--wine)}
.streak .gift{font-size:1.3rem;margin-left:4px;padding-left:8px;border-left:1.5px solid var(--line)}.streak .gift.lit{animation:wob .9s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-12deg) scale(1.15)}}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair button{position:relative;border:0;padding:0;background:none;border-radius:16px}
.pair .pic{aspect-ratio:3/4;border-radius:16px}
.pair button.mine .pic{box-shadow:0 0 0 4px var(--navy)}
.pair .pct{position:absolute;left:8px;bottom:8px;background:rgba(20,24,40,.78);color:#fff;font-weight:900;border-radius:999px;padding:4px 10px;font-size:.95rem}
.pair .pct.fav{background:var(--cash)}
.vres{text-align:center;min-height:1.6em;margin:8px 0 0;font-weight:800}.vres.hit{color:var(--cash)}.vres.miss{color:var(--red)}
.promo{display:flex;align-items:center;gap:12px;margin-top:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.promo .pic,.promo .art{width:72px;height:72px;flex:none;border-radius:12px}
.promo b{display:block;font:800 .98rem/1.2 Fraunces,serif}.promo small{display:block;color:var(--muted);margin-top:3px}
.promo .btn{margin-left:auto;flex:none;padding:10px 14px;min-height:40px;font-size:.9rem}
.art{display:grid;place-items:center;background:var(--navy);color:var(--gold)}.art svg{width:70%;height:70%}
/* gallery */
.path{display:flex;align-items:center;justify-content:space-between;gap:4px;margin:0 0 14px;overflow-x:auto;padding:2px}
.path button{flex:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;font-weight:700;color:var(--muted)}
.path .dot{display:grid;place-items:center;min-width:30px;height:30px;padding:0 10px;border-radius:999px;background:#EFE6D3;font-size:.8rem}
.path .cur .dot{background:var(--navy);color:#fff;font-weight:800}.path .done .dot{background:var(--navy2);color:#fff}
.path .line{flex:1;min-width:10px;height:2px;background:var(--line)}
.wtitle{text-align:center;font-size:1.9rem;margin:2px 0 4px}.wsub{text-align:center;color:var(--muted);margin:0 0 14px;font-weight:700}
.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:18px 12px 14px;border-radius:20px;background:linear-gradient(180deg,#F2E9D8,#EADFC9);box-shadow:inset 0 -12px 0 rgba(0,0,0,.04)}
.frame{border:0;padding:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.frame .fr{width:100%;aspect-ratio:3/4;padding:5px;border-radius:6px;background:#B98F55;box-shadow:0 8px 14px -8px rgba(0,0,0,.6)}
.frame.t-gold .fr{background:linear-gradient(135deg,#F7D774,#C99410)}.frame.t-diamond .fr{background:linear-gradient(135deg,#CFE3FF,#5B8DEF)}.frame.t-platinum .fr{background:linear-gradient(135deg,#F2F6FA,#8FA9C2)}
.frame .fr .pic{width:100%;height:100%;border-radius:3px}
.frame.empty .fr{background:repeating-linear-gradient(45deg,#E2D4B7 0 6px,#DCCDAD 6px 12px);display:grid;place-items:center}
.frame.empty .fr span{display:grid;place-items:center;width:100%;height:100%;border-radius:3px;background:#F8F3EB;font:800 2rem Fraunces;color:var(--navy)}
.frame b{font-size:.92rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame .meta{font-size:.74rem;color:var(--muted);line-height:1.3}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-weight:800;font-size:.7rem;background:#EFE6D3;color:var(--ink)}
.badge.gold{background:#F8E2A0;color:#5A3D00}.badge.diamond{background:#DCE8FF;color:#1D3E85}.badge.platinum{background:#E6EDF4;color:#34495E}
.earn{display:block;font-weight:800;color:var(--cash);font-size:.78rem}
.gstats{display:flex;justify-content:center;gap:16px;margin:12px 0;font-weight:700;color:var(--muted);font-size:.9rem}.gstats b{color:var(--ink)}
.lockn{text-align:center;color:var(--muted);font-size:.86rem;margin:10px 0 0}
.wall.cele{animation:cele 1.2s ease}@keyframes cele{30%{transform:scale(1.03);box-shadow:0 0 0 6px var(--gold)}}
/* improve */
.back{border:0;background:none;font-weight:800;color:var(--navy);padding:4px 0;margin-bottom:6px}
.imp{display:grid;grid-template-columns:44% 1fr;gap:14px;align-items:start}
.imp .pic{aspect-ratio:3/4;border-radius:18px}
.hold{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);border:0;border-radius:999px;background:rgba(255,255,255,.86);padding:7px 13px;font-weight:700;font-size:.82rem;white-space:nowrap;user-select:none;-webkit-user-select:none;touch-action:none}
.sc small{display:block;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.72rem;color:var(--muted)}
.sc .big{font:800 3rem/1 Fraunces;color:var(--cash)}.sc .rate{font-weight:700;margin:4px 0 10px;font-size:.9rem}
.edits{display:flex;flex-direction:column;gap:7px}
.ed{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:9px 11px;font-weight:700;text-align:left;font-size:.92rem}
.ed small{display:block;font-weight:600;color:var(--muted);font-size:.74rem}
.ed b{font-weight:900;color:var(--cash);white-space:nowrap}
.ed[aria-pressed="true"]{border-color:var(--navy);background:#EEF2FA;box-shadow:inset 0 0 0 1px var(--navy)}.ed[disabled]{opacity:.5}
.prem{margin-top:14px}.prem h3{font-size:1.05rem;margin:0 0 6px}
.proj{margin:14px 0 10px;border-radius:14px;background:var(--goldlt);padding:11px 13px;font-weight:700}
.proj b{font-size:1.05rem}.proj div+div{margin-top:3px}
.apply{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-radius:999px;background:var(--navy);color:#fff;padding:8px 8px 8px 22px;font-weight:800;font-size:1.15rem;min-height:60px}
.apply .pr{display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.28);box-shadow:inset 0 2px 4px rgba(0,0,0,.35);border-radius:999px;padding:9px 16px;font-size:1.1rem}
.apply[disabled]{opacity:.5;cursor:not-allowed}
.short{text-align:center;margin:8px 0 0;font-weight:700;color:var(--red)}
/* compete */
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--navy);border-radius:12px;overflow:hidden;margin:6px 0 14px}
.seg button{border:0;background:none;padding:10px;font-weight:800}.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.ccard h3{font-size:1.2rem;margin:0 0 8px}
.vs2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vs2 .pic{aspect-ratio:4/3}
.crow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-weight:700}
.champ{display:grid;grid-template-columns:42% 1fr;gap:12px;align-items:center}.champ .pic{aspect-ratio:4/3}
.champ .pot{font:800 1.7rem Fraunces}.medal{font-size:2rem}
.tcard{border-radius:var(--r);overflow:hidden;margin-bottom:12px;background:var(--card);border:1px solid var(--line)}
.tban{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:14px}
.tban svg{width:76px;height:76px;flex:none;color:var(--gold)}
.tban h3{font-size:1.6rem;line-height:1.05}.tban .when{display:inline-block;margin-top:8px;background:#fff;color:var(--navy);font-weight:800;border-radius:999px;padding:5px 12px;font-size:.88rem}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
/* overlays */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:max(12px,env(safe-area-inset-top)) 16px 30px;animation:up .22s ease-out}
.sheet>div{max-width:520px;margin:0 auto}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sh-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}.sh-top h2{font-size:1.5rem}
.x{margin-left:auto;border:0;background:#EFE6D3;width:38px;height:38px;border-radius:50%;font-size:1.1rem;font-weight:800}
.pop{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(30,26,22,.62);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.pbox{position:relative;width:min(100%,380px);background:var(--navy);color:#fff;border-radius:24px;padding:22px 18px 16px;text-align:center;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:pin .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pin{from{transform:scale(.8);opacity:0}}
.pbox h2{font-size:1.75rem;color:#fff}.pbox .amt{font:900 2rem Figtree;color:var(--gold);margin:6px 0}
.pbox p{margin:8px 0;color:#DCE2F0}.pbox .pimg{width:120px;height:120px;margin:12px auto 4px;border-radius:50%;box-shadow:0 0 0 4px #fff}
.pbox .ribbon{display:inline-block;background:#F6EEDC;color:var(--navy);font:800 1.15rem Fraunces;padding:6px 16px;border-radius:6px;margin-top:-14px;position:relative}
.pbox .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 6px}.pbox .trio .pic{aspect-ratio:3/4;box-shadow:0 0 0 3px var(--gold)}
.pbox .btn{width:100%;margin-top:10px}.pbox .btn.main{background:#F6EEDC;color:var(--navy)}.pbox .btn.sec{background:none;border:1.5px solid #F6EEDC;color:#fff}
.cf{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 2.6s ease-in infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:.2}}
.toast{position:fixed;left:50%;top:70px;z-index:50;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:.9rem;box-shadow:0 10px 20px -8px rgba(0,0,0,.5);max-width:92vw;text-align:center}
/* upload / pick lists */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}.chips button[disabled]{opacity:.4}
.samples{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}.samples button{border:0;padding:0;background:none;border-radius:10px}
.samples .pic{aspect-ratio:1}.samples button[aria-pressed="true"] .pic{box-shadow:0 0 0 3px var(--navy)}
.prev{width:60%;margin:8px auto;aspect-ratio:3/4}
.field{display:block;margin:10px 0}.field input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fff}
.lab{font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.picklist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.picklist button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:5px;text-align:center;font-weight:700;font-size:.8rem}
.picklist button[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}.picklist .pic{aspect-ratio:1;margin-bottom:4px}.picklist button[disabled]{opacity:.4}
.terms{display:flex;justify-content:space-around;margin:12px 0;text-align:center}.terms b{display:block;font:800 1.5rem Fraunces}.terms small{color:var(--muted);font-weight:700}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.duel .pic{aspect-ratio:3/4}
.duel .vsb{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;font:800 1rem Fraunces}
.duel figure{margin:0;text-align:center}.duel figcaption{font:800 1.1rem Fraunces;margin-top:6px}.duel figcaption small{display:block;font:600 .8rem Figtree;color:var(--muted)}
.duel figure.win .pic{box-shadow:0 0 0 4px var(--cash)}
.vbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:12px 0 4px;background:#EFE6D3}.vbar i{display:block;height:100%;transition:width .2s}.vbar .a{background:var(--navy)}.vbar .b{background:#C9B48A}
.track{display:flex;flex-direction:column;gap:8px;margin:12px 0}.track div{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#fff;border:1px solid var(--line)}.track .got{background:var(--cashlt)}
.rvl button{display:block;width:100%;text-align:left;margin:0 0 8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font-weight:700}.rvl small{display:block;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.vh h1{font-size:1.45rem}.imp{grid-template-columns:1fr}.wallet span{padding:5px 8px}}
</style></head>
<body>
<div class="app">
  <header class="bar"><span class="logo">Yofi</span><button class="rv" id="rvBtn" aria-label="Reviewer controls">Review</button>
    <div class="wallet" aria-label="Wallet"><span class="cash" title="Demo cash">$<b id="wCash">0.00</b></span><span class="coin" title="Coins"><i class="coinic"></i><b id="wCoins">0</b></span></div></header>
  <main id="view"></main>
  <nav class="tabs" aria-label="Main"><div>
    <button data-tab="vote"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/></svg><span>Vote</span></button>
    <button data-tab="gallery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-6-6-9 9"/></svg><span>Gallery</span></button>
    <button data-tab="compete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8"/></svg><span>Compete</span></button>
  </div></nav>
</div>
<input type="file" id="file" accept="image/*" hidden>
<script>
const PH = __PHOTOS__;
(() => {
'use strict';
/* ---------------- tuning (all configurable) ---------------- */
const CFG = {
  JUDGE: 2,                       // coins for each vote you cast
  BASE: 1,                        // coins per vote your photo receives, before its multiplier
  MULT: [[90, 6], [85, 5], [80, 4], [75, 3], [70, 2], [0, 1]],
  STREAK: [{ n: 3, c: 10 }, { n: 6, c: 20 }, { n: 10, c: 40 }],
  EDITS: [
    { k: 'light', t: 'Fix lighting', g: 3, f: l => `brightness(${1 + .05 * l}) contrast(${1 + .02 * l})` },
    { k: 'colour', t: 'Boost colour', g: 2, f: l => `saturate(${1 + .18 * l})` },
    { k: 'sharp', t: 'Sharpen details', g: 2, f: l => `contrast(${1 + .07 * l})` },
    { k: 'bg', t: 'Soften background', g: 4, vig: l => .22 * l }],
  EDIT_LEVELS: 3,
  PRICE: s => s < 70 ? 100 : s < 80 ? 150 : 200,
  PREMIUM: [
    { k: 'suncast', t: 'Suncast', g: 4, f: l => `sepia(${.14 * l}) saturate(${1 + .15 * l})`, warm: l => .5 * l },

    <div class="terms"><div><b>${money(CFG.CHAMP.entry)}</b><small>Entry</small></div><div><b>${money(ch.pot)}</b><small>Progressive pot</small></div></div>
    <div id="dBody"><button class="btn cash block" id="cGo" ${pid && S.cash >= CFG.CHAMP.entry ? '' : 'disabled'}>Challenge for ${money(CFG.CHAMP.entry)}</button><div style="text-align:center"><button class="link" id="cBack">Back to voting</button></div></div>`);
    b.querySelectorAll('[data-cp]').forEach(x => x.onclick = () => { pid = x.dataset.cp; draw(); });
    b.querySelector('#cBack').onclick = () => { closeSheet(); S.tab = 'vote'; save(); render(); };
    const go = b.querySelector('#cGo'); if (go) go.onclick = () => { const mp = P(pid); S.cash -= CFG.CHAMP.entry; save(); paint();
      const won = S.force ? S.force === 'win' : Math.random() < Math.max(.2, Math.min(.7, .4 + (mp.score - Q[ch.sid]) / 60)); S.force = null;
      runVotes(b.querySelector('#dBody'), 21, won, (m, t) => {
        if (won) { const pot = ch.pot; S.cash += pot; S.results.push(`${mp.name} beat champion ${ch.name} ${m}–${t} · won ${money(pot)}`); S.champ = { name: mp.name, owner: 'you', sid: mp.sid || 'goldie', pid: mp.id, cat: ch.cat, pot: CFG.CHAMP.start, mine: true }; }
        else { ch.pot += CFG.CHAMP.grow; S.results.push(`${ch.name} defended against ${mp.name} ${t}–${m} · pot now ${money(ch.pot)}`); }
        save(); paint(); (won ? b.querySelector('#dA') : b.querySelector('#dB')).classList.add('win');
        b.querySelector('#dBody').innerHTML = `<h2 style="text-align:center;margin:10px 0 2px">${won ? `${esc(mp.name)} is the new champion!` : `${esc(ch.name)} defends`}</h2><p style="text-align:center;margin:0 0 12px;font-weight:800">${m} – ${t} votes · ${won ? `you won ${money(ch.pot)}` : `pot grows to ${money(S.champ.pot)}`}</p><button class="btn block" id="cDone">Back to voting</button>`;
        b.querySelector('#cDone').onclick = () => { closeSheet(); S.tab = 'vote'; V.card = pickCard(); save(); render(); };
        if (won) pop({ title: 'New champion!', img: mp, amt: `+${money(ch.pot)}`, confetti: 1, text: `${esc(mp.name)} took the ${catName(ch.cat)} crown.`, cta: 'Collect' });
      }); }; };
  draw();
}
/* tournaments */
function makeBracket(t) { const pool = Object.keys(PH).filter(id => !owned().has(id)).sort(() => Math.random() - .5); return pool.slice(0, t.size - 1); }
function openTour(k) {
  tourTick(); const t = S.tours[k], nm = k === 'sprint' ? 'Hourly Sprint' : 'Daily Cup', rounds = Math.log2(t.size);
  if (t.state === 'live') return playTour(k);
  const el = S.photos.filter(p => p.score >= CFG.MIN_SCORE); let pid = t.photoId || (el.slice().sort((a, b) => b.score - a.score)[0] || {}).id;
  const draw = () => { const b = sheet(nm, `<div class="tban" style="border-radius:16px">${k === 'sprint' ? SVG.watch : SVG.trophy}<div><h3>${nm}</h3><span class="when">${k === 'cup' && t.state === 'open' ? 'Today 8 pm' : tourWhen(t)}</span></div></div>
    <div class="terms"><div><b>${money(t.entry)}</b><small>Entry</small></div><div><b>${money(t.pool)}</b><small>Prize pool</small></div><div><b>${t.size}</b><small>Photos</small></div></div>
    <div class="card small"><b>Format:</b> ${t.size}-photo knockout, ${rounds} rounds. Each round the crowd votes on your photo against one other; the winner goes through.<br><b>Eligibility:</b> any of your photos scoring ${CFG.MIN_SCORE}+.<br><b>Registered:</b> ${t.regs + (t.state !== 'open' ? 1 : 0)} of ${t.size}<br><b>Payouts:</b> 1st ${money(t.pool * CFG.PAYOUT[0])} · 2nd ${money(t.pool * CFG.PAYOUT[1])} · 3rd–4th ${money(t.pool * CFG.PAYOUT[2])} each</div>
    ${t.state === 'open' ? (el.length ? `<p class="lab">Your photo</p><div class="picklist">${el.map(p => `<button data-tp="${p.id}" aria-pressed="${p.id === pid}">${pic(p)}${esc(p.name)} · ${p.score}</button>`).join('')}</div>
      <button class="btn cash block" id="tGo" style="margin-top:12px" ${pid && S.cash >= t.entry ? '' : 'disabled'}>Join for ${money(t.entry)}</button>` : `<p class="short">You need a photo scoring ${CFG.MIN_SCORE}+ to enter.</p>`)
      : t.state === 'reg' ? `<p style="text-align:center;font-weight:800;margin-top:14px">✓ Registered with ${esc(P(t.photoId).name)} · ${tourWhen(t)}</p>`
      : `<p style="text-align:center;font-weight:800;margin-top:14px">${t.won ? `You won ${money(t.won)}` : `You finished ${ord(t.place)}`}</p>`}
    <div style="text-align:center"><button class="link" id="tBack">Back to voting</button></div>`);
    b.querySelectorAll('[data-tp]').forEach(x => x.onclick = () => { pid = x.dataset.tp; draw(); });
    b.querySelector('#tBack').onclick = () => { closeSheet(); S.tab = 'vote'; save(); render(); };
    const go = b.querySelector('#tGo'); if (go) go.onclick = () => { if (t.state !== 'open') return; S.cash -= t.entry; t.state = 'reg'; t.photoId = pid; t.bracket = makeBracket(t); save(); paint(); toast(`Registered for the ${nm}`); draw(); }; };
  draw();
}
function playTour(k) {
  const t = S.tours[k], nm = k === 'sprint' ? 'Hourly Sprint' : 'Daily Cup', mp = P(t.photoId), rounds = Math.log2(t.size), rname = r => r === rounds - 1 ? 'Final' : r === rounds - 2 ? 'Semi-final' : `Round ${r + 1}`;
  const opp = t.bracket[t.round];
  const b = sheet(`${nm} · ${rname(t.round)}`, `<div class="duel"><figure id="dA">${pic(mp)}<figcaption>${esc(mp.name)}<small>Your photo · ${mp.score}</small></figcaption></figure><span class="vsb">VS</span><figure id="dB">${spic(opp)}<figcaption>Rival<small>${t.size - Math.pow(2, rounds - t.round) + 1 > 0 ? '' : ''}</small></figcaption></figure></div>
    <div id="dBody"><button class="btn block" id="rGo" style="margin-top:14px">Reveal votes</button><div style="text-align:center"><button class="link" id="rBack">Back to voting</button></div></div>`);
  b.querySelector('#rBack').onclick = () => { closeSheet(); S.tab = 'vote'; save(); render(); };
  b.querySelector('#rGo').onclick = () => { const won = Math.random() < Math.max(.3, Math.min(.8, .55 + (mp.score - Q[opp]) / 60));
    runVotes(b.querySelector('#dBody'), 11, won, (m, n2) => { (won ? b.querySelector('#dA') : b.querySelector('#dB')).classList.add('win');
      if (won && t.round < rounds - 1) { t.round++; save(); b.querySelector('#dBody').innerHTML = `<h2 style="text-align:center;margin:10px 0">Through to the ${rname(t.round).toLowerCase()}! ${m}–${n2}</h2><button class="btn block" id="rNext">Next round</button><div style="text-align:center"><button class="link" id="rBack2">Back to voting</button></div>`;
        b.querySelector('#rNext').onclick = () => playTour(k); b.querySelector('#rBack2').onclick = () => { closeSheet(); S.tab = 'vote'; save(); render(); }; return; }
      const place = won ? 1 : t.round === rounds - 1 ? 2 : t.round === rounds - 2 ? 3 : Math.pow(2, rounds - t.round - 1) + 1, share = place === 1 ? CFG.PAYOUT[0] : place === 2 ? CFG.PAYOUT[1] : place <= 4 ? CFG.PAYOUT[2] : 0, prize = +(t.pool * share).toFixed(2);
      if (t.state !== 'done') { t.state = 'done'; t.place = place; t.won = prize; S.cash += prize; S.results.push(`${nm}: ${mp.name} finished ${ord(place)}${prize ? ` · won ${money(prize)}` : ''}`); save(); paint(); }
      b.querySelector('#dBody').innerHTML = `<h2 style="text-align:center;margin:10px 0 2px">${place === 1 ? 'Tournament winner!' : `You finished ${ord(place)}`}</h2><p style="text-align:center;font-weight:800;margin:0 0 12px">${prize ? `+${money(prize)}` : 'No prize this time'}</p><button class="btn block" id="rEnd">Back to voting</button>`;
      b.querySelector('#rEnd').onclick = () => { closeSheet(); S.tours[k] = newTour(k, now()); S.tab = 'vote'; save(); render(); };
      if (prize) pop({ title: place === 1 ? 'You win the ' + nm + '!' : `${ord(place)} place`, img: mp, amt: `+${money(prize)}`, confetti: place === 1, cta: 'Collect' });
    }); };
}
/* ================= gift track ================= */
function openGift() {
  const lvl = 1 + Math.floor(S.votes / 25);
  const b = sheet('Judging rewards', `<p style="margin:0 0 4px;font-weight:700">Judging level ${lvl} · ${S.votes} votes</p><p class="small muted" style="margin:0">Pick the crowd’s favourite in a row to open gifts. A miss starts the run again.</p>
    <div class="track">${CFG.STREAK.map(m => `<div class="${S.streak >= m.n ? 'got' : ''}"><span style="font-size:1.5rem">🎁</span><span style="flex:1"><b>${m.n} in a row</b><br><span class="small muted">${S.streak >= m.n ? 'Reached this run' : `${m.n - S.streak} more`}</span></span><b>+${m.c} ${coin}</b></div>`).join('')}</div>
    <p style="text-align:center;font-weight:800">Current run: ${S.streak}</p><button class="btn block" id="gBack">Keep voting</button>`);
  b.querySelector('#gBack').onclick = () => { closeSheet(); render(); };
}
/* ================= away earnings ================= */
function awayCheck(force) {
  if (!S.photos.length) return;
  const away = Date.now() - (S.lastSeen || Date.now()), batch = force || (away > 10 * 60000 ? { id: S.lastSeen } : null); if (!batch || S.credited === batch.id) return;
  const per = force ? force.votes : S.photos.map(p => Math.min(12, Math.round(away / 3600000 * (1 + (p.score - 55) / 15)))), ids = force ? force.ids : S.photos.map(p => p.id);
  let tot = 0, top = null; ids.forEach((id, k) => { const p = P(id), n = per[k] || 0; if (!p || !n) return; let got = 0; for (let j = 0; j < n; j++) got += receive(id); tot += got; if (!top || got > top.got) top = { p, got }; });
  S.credited = batch.id; save(); paint(); if (!tot) return;
  pop({ title: `Your photos earned ${tot} coins while you were away`, amt: `+${tot} coins`, img: top.p, ribbon: `Top earner: ${esc(top.p.name)} · ${top.got} coins`, cta: 'View gallery', go: () => { S.tab = 'gallery'; S.view = 'wall'; S.cat = top.p.cat; save(); render(); }, later: 'Keep voting' });
}
/* ================= reviewer controls ================= */
function mk(cat, list) { S.slots[cat] = [null, null, null]; list.forEach(([sid, name, score], i) => { const p = { id: 'p' + (S.nid++), name, cat, sid, score, lv: {}, pr: {}, today: 0, life: 0, recv: 0 }; S.photos.push(p); S.slots[cat][i] = p.id; }); }
const PRESETS = {
  first: ['First visit', 'Empty gallery, onboarding', () => { S = fresh(); }],
  quick: ['Quick demo · near Gold', 'Milo 69, Cleo 70, Pip 70 · 80 coins', () => { S = fresh(); S.onboard = 1; S.coins = 80; mk('pets', [['beachdog', 'Milo', 69], ['tabby', 'Cleo', 70], ['shades', 'Pip', 70]]); S.lastImp = S.photos[0].id; }],
  mixed: ['Mixed tiers', 'Milo 85, Cleo 80, Pip 78 · Travel open', () => { S = fresh(); S.onboard = 1; S.coins = 150; mk('pets', [['beachdog', 'Milo', 85], ['tabby', 'Cleo', 80], ['shades', 'Pip', 78]]); S.unlocked = ['pets', 'travel']; S.slots.travel = [null, null, null]; S.best.pets = 'Gold'; S.lastImp = S.photos[2].id; }],
  thresh: ['Near thresholds', 'Milo 84, Cleo 79, Pip 89 · 600 coins', () => { S = fresh(); S.onboard = 1; S.coins = 600; mk('pets', [['beachdog', 'Milo', 84], ['tabby', 'Cleo', 79], ['shades', 'Pip', 89]]); S.unlocked = ['pets', 'travel']; S.slots.travel = [null, null, null]; S.best.pets = 'Gold'; S.lastImp = S.photos[0].id; }],
  night: ['Overnight earnings', 'Mixed tiers + 6, 1 and 2 votes received', () => { PRESETS.mixed[2](); setTimeout(() => awayCheck({ id: 'demo' + Date.now(), ids: S.photos.map(p => p.id), votes: [6, 1, 2] }), 300); }],
  inv: ['Incoming challenge', 'Larry challenges your best photo', () => { if (!S.photos.length) PRESETS.quick[2](); addInvite(0); V.card = pickCard(); S.tab = 'vote'; }],
  cdef: ['Champion defence', 'Next champion challenge loses', () => { if (!S.photos.length) PRESETS.quick[2](); S.champ = fresh().champ; S.force = 'lose'; S.tab = 'compete'; S.ctab = 'ch'; }],
  closs: ['Champion loss', 'Next champion challenge wins', () => { if (!S.photos.length) PRESETS.quick[2](); S.champ = fresh().champ; S.force = 'win'; S.tab = 'compete'; S.ctab = 'ch'; }],
  tstart: ['Tournament start', 'Move the demo clock past both start times', () => { const st = Math.max(S.tours.sprint.start, S.tours.cup.start); S.clock += Math.max(0, st - now()) + 1000; tourTick(); S.tab = 'compete'; S.ctab = 'tour'; }],
  coins: ['+500 coins', 'For trying later edits', () => { S.coins += 500; }],
  cash: ['+$20 demo cash', 'Top up the demo wallet', () => { S.cash += 20; }]
};
function openReview() {
  const b = sheet('Reviewer controls', `<p class="small muted" style="margin:0 0 10px">For review only. Everything is simulated: players, votes, clocks and cash.</p><div class="rvl">${Object.entries(PRESETS).map(([k, v]) => `<button data-pre="${k}">${v[0]}<small>${v[1]}</small></button>`).join('')}</div>`);
  b.querySelectorAll('[data-pre]').forEach(x => x.onclick = () => { PRESETS[x.dataset.pre][2](); V = { busy: false, pend: null }; save(); closeSheet(); render(); window.scrollTo(0, 0); });
}
/* ================= wiring ================= */
function wire() {
  const v = $('#view');
  v.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => doVote(+b.dataset.vote));
  const g = v.querySelector('[data-goal]'); if (g) g.onclick = () => { const x = goal(); if (x.go === 'upload') openUpload(S.cat); else if (x.go === 'gallery') { S.tab = 'gallery'; S.view = 'wall'; save(); render(); } else openImprove(x.p.id); };
  const gf = v.querySelector('[data-gift]'); if (gf) gf.onclick = openGift;
  v.querySelectorAll('[data-open-inv]').forEach(b => b.onclick = () => openInvite(b.dataset.openInv));
  v.querySelectorAll('[data-champ]').forEach(b => b.onclick = openChamp);
  v.querySelectorAll('[data-tour]').forEach(b => b.onclick = () => openTour(b.dataset.tour));
  v.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { if (!S.unlocked.includes(b.dataset.cat)) { toast(b.title); return; } S.cat = b.dataset.cat; S.view = 'wall'; save(); render(); });
  v.querySelectorAll('[data-add]').forEach(b => b.onclick = () => openUpload(S.cat, +b.dataset.add));
  v.querySelectorAll('[data-imp]').forEach(b => b.onclick = () => openImprove(b.dataset.imp));
  const w = v.querySelector('[data-wall]'); if (w) w.onclick = () => { S.view = 'wall'; V.pend = null; save(); render(); };
  v.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => { const k = b.dataset.ed, pr = b.dataset.prem === '1'; V.pend = V.pend && V.pend.k === k && V.pend.prem === pr ? null : { k, prem: pr }; render(); });
  const ap = v.querySelector('[data-apply]'); if (ap) ap.onclick = applyEdit;
  const cn = v.querySelector('[data-cancel]'); if (cn) cn.onclick = () => { V.pend = null; render(); };
  const h = v.querySelector('#hold'); if (h) { const p = P(S.impId), pend = V.pend, el = () => $('#impPic');
    const show = raw => { const st = raw ? { f: 'none', vig: 0, warm: 0 } : filters(p, pend), e = el(); if (!e) return; e.querySelector('img').style.filter = st.f; e.querySelector('.vig').style.opacity = Math.min(1, st.vig); e.querySelector('.warm').style.opacity = Math.min(1, st.warm); };
    h.addEventListener('pointerdown', e => { e.preventDefault(); show(true); h.textContent = 'Original'; }); ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => h.addEventListener(t, () => { show(false); h.textContent = 'Hold to compare'; })); }
  v.querySelectorAll('[data-ctab]').forEach(b => b.onclick = () => { S.ctab = b.dataset.ctab; save(); render(); });
  const nc = v.querySelector('[data-newch]'); if (nc) nc.onclick = newChallenge;
  v.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; save(); render(); });
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; if (S.tab === 'gallery' && S.view === 'improve' && !P(S.impId)) S.view = 'wall'; closeSheet(); save(); render(); window.scrollTo(0, 0); });
$('#rvBtn').onclick = openReview;
setInterval(() => { if (S.tab === 'compete' || (S.tab === 'vote' && V.card && V.card.k === 'tour' && !V.busy)) { const was = JSON.stringify(S.tours); tourTick(); if (S.tab === 'compete' || was !== JSON.stringify(S.tours)) { if (!$('#sheet')) render(); } } }, 30000);
/* ================= boot ================= */
S = load() || fresh(); roll();
render(); awayCheck();
if (!S.photos.length && !S.onboard) { S.onboard = 1; save(); pop({ title: 'Your photos can earn', text: 'Add a photo and it earns coins every time someone picks it. Use coins to improve it and build your collection.', cta: 'Add a photo', go: () => openUpload('pets'), later: 'Look around first' }); }
window.addEventListener('pagehide', save);
window.__yofi = { get S() { return S; }, CFG, mult, col, applyEdit, receive, awayCheck, openImprove, render, PRESETS };
})();
</script>
