<title>Derby Pick</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: a casino app shell — sticky wallet bar, one working panel, a bottom tab bar (Lobby / Contest / Staff) */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --sunk:#E9E6DF; --line:#D9D4C8; --fg:#16201C; --muted:#5E6963;
  --felt:#0F7A55; --felt-ink:#FFFFFF; --brass:#B8862B; --brass-soft:#F4E7C8; --warn:#B86A0F; --bad:#B3392F; --good:#1F7A46;
  --font-display:"Syne","Trebuchet MS",sans-serif; --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --font-data:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201C; --sunk:#111915; --line:#2A3631; --fg:#E9EFEB; --muted:#9AA8A1;
  --felt:#1FA472; --felt-ink:#04140D; --brass:#D9A845; --brass-soft:#2D2614; --warn:#E39A3A; --bad:#E0675C; --good:#4CC08A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201C; --sunk:#111915; --line:#2A3631; --fg:#E9EFEB; --muted:#9AA8A1;
  --felt:#1FA472; --felt-ink:#04140D; --brass:#D9A845; --brass-soft:#2D2614; --warn:#E39A3A; --bad:#E0675C; --good:#4CC08A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font:800 1.15rem/1 var(--font-display);letter-spacing:.01em}
.brand small{display:block;font:600 .62rem/1.2 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.wallet{margin-left:auto;display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font:700 .85rem var(--font-data);font-variant-numeric:tabular-nums}
.pill i{font-style:normal;font:600 .66rem var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
main{flex:1;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.tabs div{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font:600 .8rem var(--font-body);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button b{font:800 1.05rem/1 var(--font-display)}
.tabs button[aria-current="page"]{color:var(--felt)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
h1{font-size:1.7rem;line-height:1.1}
h2{font-size:1.25rem;line-height:1.15}
h3{font-size:1rem}
.lede{margin:4px 0 0;color:var(--muted);max-width:62ch}
.eyebrow{font:700 .7rem var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:700;background:var(--sunk);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.cash{background:var(--felt);color:var(--felt-ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:4px;color:var(--muted);text-decoration:underline;font-size:.88rem}
.note{font-size:.85rem;color:var(--muted);margin:0}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
/* lobby */
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.game{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--sunk);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font:700 .82rem var(--font-body);color:var(--muted)}
.game span{font-size:1.6rem;line-height:1}
.feature{position:relative;overflow:hidden;border:0;text-align:left;width:100%;border-radius:18px;background:var(--felt);color:var(--felt-ink);padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:14px;align-items:center}
.feature h2{color:inherit;font-size:1.45rem}
.feature p{margin:6px 0 0;font-size:.9rem;opacity:.9}
.feature .stack{position:relative;height:120px}
.feature .stack img{position:absolute;width:78px;height:96px;object-fit:cover;border-radius:8px;border:3px solid var(--surface);box-shadow:0 8px 18px rgba(0,0,0,.3)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--sunk);border-radius:10px;padding:10px}
.fact b{display:block;font:700 1.05rem var(--font-data);font-variant-numeric:tabular-nums}
.fact small{font-size:.72rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.phase{display:flex;gap:6px}
.phase span{flex:1;text-align:center;padding:7px 4px;border-radius:8px;background:var(--sunk);font:600 .74rem var(--font-body);color:var(--muted)}
.phase span.on{background:var(--brass-soft);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--brass)}
.phase span.done{color:var(--good)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font:700 .72rem var(--font-body);background:var(--sunk);color:var(--muted)}
.chip.good{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.chip.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.role{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--brass-soft);font-size:.88rem}
.role b{display:block}
/* picker */
.roll{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.roll button{padding:0;border:0;border-radius:10px;overflow:hidden;aspect-ratio:4/5;position:relative;background:var(--sunk)}
.roll img{width:100%;height:100%;object-fit:cover;display:block}
.roll button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--felt)}
.stakes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stakes button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font:700 .95rem var(--font-data)}
.stakes button[aria-pressed="true"]{border-color:var(--felt);box-shadow:inset 0 0 0 1.5px var(--felt)}
/* judging */
.prog{display:flex;align-items:center;gap:10px}
.prog .track{flex:1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--felt);transition:width .25s}
.duel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.duel button{padding:0;border:0;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:var(--sunk);position:relative}
.duel button.pick{box-shadow:0 0 0 4px var(--good)}
.duel button.pick.miss{box-shadow:0 0 0 4px var(--warn)}
.duel button[disabled]{cursor:default}
.duel img.qc{filter:blur(7px) brightness(.6) saturate(.4);-webkit-filter:blur(7px) brightness(.6) saturate(.4);transform:scale(1.12)}
.duel button:hover img.qc{transform:scale(1.12)}
.duel .pct{position:absolute;left:8px;bottom:8px;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font:700 .95rem var(--font-data);animation:pop .25s ease-out}
.duel .pct.top{background:var(--good)}
.verdict{margin:10px 0 0;text-align:center;font-weight:700;font-size:.95rem;color:var(--muted);min-height:1.4em}
.verdict.hit{color:var(--good)}.verdict.miss{color:var(--warn)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.duel img{width:100%;height:100%;object-fit:cover;display:block}
.duel button:hover img{transform:scale(1.02)}
.duel img{transition:transform .2s}
@media (prefers-reduced-motion:reduce){.duel img,.prog .track i{transition:none}}
.vs{text-align:center;font:800 .9rem var(--font-display);color:var(--muted);letter-spacing:.1em}
/* spectator */
.field{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.field button{padding:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden;text-align:left}
.field img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.field span{display:flex;justify-content:space-between;padding:6px 8px;font:600 .74rem var(--font-data);font-variant-numeric:tabular-nums}
.field span em{font-style:normal;color:var(--muted)}
.field button[aria-pressed="true"]{border-color:var(--felt);box-shadow:inset 0 0 0 2px var(--felt)}
/* results */
.lb{display:flex;flex-direction:column;gap:6px}
.lr{display:grid;grid-template-columns:28px 44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--sunk)}
.lr img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.lr b{font:700 .9rem var(--font-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr small{display:block;color:var(--muted);font:500 .72rem var(--font-data)}
.lr .pl{font:800 .95rem var(--font-display);text-align:center}
.lr .pz{font:700 .9rem var(--font-data);color:var(--good)}
.lr.bet{grid-template-columns:58px minmax(0,1fr) auto}
.lr.bet .pl{font:700 .78rem var(--font-body);text-align:left;white-space:nowrap}
.lr.bet .row{flex-wrap:nowrap}
.lr.me{box-shadow:inset 0 0 0 2px var(--felt);background:var(--surface)}
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.money .fact b.up{color:var(--good)}
.money .fact b.dn{color:var(--bad)}
/* staff */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.82rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:700 .68rem var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
td.n{font-family:var(--font-data);font-variant-numeric:tabular-nums;text-align:right}
tr:last-child td{border-bottom:0}
.trust{display:inline-flex;align-items:center;gap:6px;font:700 .82rem var(--font-data)}
.trust i{width:34px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:inline-block}
.trust i u{display:block;height:100%}
.hold{padding:12px 14px;border-radius:12px;border:1.5px solid var(--bad);color:var(--bad);font-weight:600;font-size:.9rem}
.ok{padding:12px 14px;border-radius:12px;border:1.5px solid var(--good);color:var(--good);font-weight:600;font-size:.9rem}
.demo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-radius:12px;border:1px dashed var(--line);font-size:.82rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:420px){.feature{grid-template-columns:minmax(0,1fr)}.feature .stack{display:none}.roll{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pill.bb{background:var(--brass-soft);border-color:var(--brass)}
.bbtxt{color:var(--brass);font-weight:800}
.chip .bbtxt{color:inherit}
.bbwin{margin:10px 0;padding:12px 14px;border-radius:12px;background:var(--brass-soft);border:1px solid var(--brass)}
.bbwin b{display:block;font:800 1.5rem var(--font-data);color:var(--brass)}
.bbwin small{font-size:.8rem;color:var(--fg)}
.bbwin.held{background:var(--sunk);border-color:var(--line)}.bbwin.held b{color:var(--muted)}
.btn:not(.cash):not(.ghost):not(.bbbtn):not(.featcta).block{background:var(--fg);color:var(--bg)}
@media (max-width:420px){.brand{font-size:.95rem;white-space:nowrap}.pill.cashp i{display:none}.brand small{display:none}.pill{padding:5px 8px;gap:4px}}
.btn.bbbtn{background:var(--brass);color:#1B1400}
.lr.bet .pz small{display:block;font:500 .66rem var(--font-data);color:var(--muted);text-align:right}
.segA{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.segA button,.tiers button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 2px;font:700 .85rem var(--font-body)}
.segA small,.tiers small{display:block;font:500 .66rem var(--font-data);color:var(--muted);margin-top:2px}
.segA button[aria-pressed="true"]{background:var(--brass-soft);box-shadow:inset 0 0 0 2px var(--brass)}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.tiers button{font:700 .9rem var(--font-data)}.tiers small{color:var(--brass);font-size:.72rem}
.tiers button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flybb{position:fixed;z-index:50;padding:6px 12px;border-radius:999px;background:var(--brass);color:#1B1400;font:800 1.05rem var(--font-data);white-space:nowrap;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.3);transform:translate(-50%,-50%)}
.pill.bump{animation:bump .45s ease-out}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.18);box-shadow:0 0 0 4px var(--brass-soft)}100%{transform:scale(1)}}
.judgecard{border-color:var(--brass);background:linear-gradient(180deg,var(--brass-soft),var(--surface) 70%)}
.judgecard h2{margin:2px 0 0}
.featcta{margin-top:14px;background:var(--felt-ink);color:var(--felt);font-size:1rem}
.upside{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.upside div{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}
.upside b{display:block;font:800 1.45rem var(--font-data);color:inherit}
.upside small{font:600 .7rem var(--font-body);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.lineup{position:relative;height:118px;margin:2px 0 14px}
.lineup .lp{position:absolute;left:calc(50% + var(--i) * min(46px, 11.5vw));top:18px;width:62px;height:78px;margin-left:-31px;border-radius:9px;border:3px solid #fff;overflow:visible;box-shadow:0 8px 18px rgba(0,0,0,.35);transform:rotate(calc(var(--i) * 5deg));background:#fff}
.lineup .lp img{width:100%;height:100%;object-fit:cover;border-radius:6px;display:block}
.lineup .lp.win{top:0;width:84px;height:104px;margin-left:-42px;z-index:2;transform:none;border-color:var(--brass);box-shadow:0 12px 26px rgba(0,0,0,.45)}
.lineup .lp em{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);background:var(--brass);color:#1B1400;font:800 .72rem var(--font-data);padding:3px 9px;border-radius:999px;font-style:normal;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.lineup .lp:nth-child(1),.lineup .lp:nth-child(6){opacity:.85}
.minivs{position:relative;display:flex;align-items:center;flex:none}
.minivs img{width:46px;height:58px;object-fit:cover;border-radius:7px;border:2px solid #fff;box-shadow:0 5px 12px rgba(0,0,0,.25)}
.minivs img:first-child{transform:rotate(-6deg)}.minivs img:last-of-type{transform:rotate(6deg)}
.minivs b{margin:0 -6px;z-index:1;background:var(--fg);color:var(--bg);font:800 .62rem var(--font-display);padding:4px 5px;border-radius:999px}
.minivs em{position:absolute;right:-6px;top:-10px;background:var(--brass);color:#1B1400;font:800 .62rem var(--font-data);padding:2px 6px;border-radius:999px;font-style:normal;transform:rotate(8deg)}
@media (max-width:360px){.brand{font-size:.78rem}.pill{padding:4px 7px;font-size:.78rem}.pill.bb i{display:none}.minivs img{width:36px;height:46px}.judgecard h2{font-size:1.25rem}}
.themetag{display:inline-block;background:var(--brass-soft);color:var(--fg);font:800 .78rem var(--font-body);padding:5px 11px;border-radius:999px;margin-bottom:6px}
.week{display:flex;flex-direction:column;gap:8px}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.strip button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:6px 1px 5px;text-align:center;font:inherit;min-width:0}
.strip small{display:block;font:700 .6rem var(--font-data);color:var(--muted)}
.strip span{display:block;font-size:1.05rem;margin:2px 0 1px}
.strip b{display:block;font-size:.58rem;line-height:1.15;overflow-wrap:anywhere}
.strip i{display:block;font:800 .5rem var(--font-body);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);margin-top:2px}
.strip .today{background:var(--felt);color:var(--felt-ink);border-color:var(--felt)}.strip .today small,.strip .today i{color:var(--felt-ink);opacity:.85}
.strip button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--brass)}
.dayline{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.84rem;line-height:1.4}
.dayline small{display:block;color:var(--muted);font-size:.74rem;margin-top:2px}
.dayline .link{flex:none;font-weight:700}.dayline em{flex:none;font-style:normal;font-weight:700;font-size:.78rem;color:var(--good)}
/* ===== Casino theme: deep teal, gold money, teal BBs ===== */
:root:root:root{
  --bg:#0A1F27; --surface:#10313B; --sunk:#0C2830; --line:#1F4A55; --fg:#F4F6F2; --muted:#A3BDC3;
  --felt:#F5B533; --felt-ink:#2A1600; --brass:#5FC7D1; --brass-soft:rgba(95,199,209,.14);
  --gold:#F5B533; --gold-hi:#FFD978; --gold-lo:#D98A06; --gold-grad:linear-gradient(180deg,#FFD978 0%,#F5B533 52%,#E2930C 100%);
  --teal-grad:linear-gradient(180deg,#8BE0E7 0%,#5FC7D1 55%,#3AA3AE 100%);
  --warn:#F2A54A; --bad:#FF6B5E; --good:#46D58A;
  --font-display:"Montserrat","Trebuchet MS",sans-serif; --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --font-data:"Montserrat",system-ui,sans-serif;
  --r:16px; color-scheme:dark;
}
body{background:radial-gradient(120% 60% at 50% -10%,#174A56 0%,rgba(10,31,39,0) 60%),radial-gradient(80% 50% at 100% 30%,rgba(245,181,51,.07),rgba(10,31,39,0) 70%),var(--bg);background-attachment:fixed;font-size:15px}
body.locked{overflow:hidden}
body::before{background:#0B232B}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-.01em}
h1{font-size:1.65rem}
.eyebrow{color:var(--gold);font-family:var(--font-display);font-weight:800}
.lede,.note{color:var(--muted)}
.mono,.fact b,.pill,.pz,.lr .pl{font-family:var(--font-data);font-variant-numeric:tabular-nums}

/* header */
.bar{flex-wrap:wrap;justify-content:center;gap:8px 8px;background:rgba(11,35,43,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid rgba(95,199,209,.18);padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font:900 1.15rem/1 var(--font-display);letter-spacing:.02em;white-space:nowrap}
.brand span{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
.brand b{font-weight:900;margin-left:.3em}
.brand .wing{width:46px;height:16px;flex:none}.brand .wing:not(.r){transform:scaleX(-1)}
.brand small{display:none}
.wallet{margin:0;width:100%;display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.pill{justify-content:flex-start;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:#0B2229;border:2px solid var(--gold);font:700 .98rem var(--font-data);color:var(--fg);min-width:0}
.pill.bb{border-color:var(--brass);background:#0B2229}
.pill small{font:700 .7rem var(--font-display);color:var(--muted);margin-left:-3px}
.pill #bal,.pill #bbal{overflow:hidden;text-overflow:ellipsis}
.pill.bump{animation:bump .45s ease-out}
.coin{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font:900 .8rem/1 var(--font-display);font-style:normal;color:#5A3300;background:radial-gradient(circle at 35% 30%,#FFE9A3,#F5B533 60%,#C77C02);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.cashp .coin{background:none;color:var(--gold);box-shadow:none;font-size:1.05rem}
.btn.dep{background:var(--gold-grad);color:var(--felt-ink);padding:8px 14px;font-size:.86rem;box-shadow:0 2px 0 #A86400,0 6px 16px -6px rgba(245,181,51,.6)}

/* buttons */
.btn{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:.95rem;min-height:48px;border-radius:999px}
.btn.cash,.btn.featcta,.btn.featcta.block{background:var(--gold-grad);color:var(--felt-ink);box-shadow:0 3px 0 #A86400,0 10px 22px -10px rgba(245,181,51,.75)}
.btn.cash:active,.btn.bbbtn:active{transform:translateY(2px);box-shadow:none}
.btn.bbbtn{background:var(--teal-grad);color:#04252B;box-shadow:0 3px 0 #237A84,0 10px 22px -10px rgba(95,199,209,.7)}
.btn.ghost{border:1.5px solid rgba(255,255,255,.28);color:var(--fg)}
.btn:not(.cash):not(.ghost):not(.bbbtn):not(.featcta):not(.dep).block{background:#F4F6F2;color:#0A1F27}
.btn[disabled]{filter:grayscale(.6)}
.link{color:var(--muted);font-weight:600}

/* cards */
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)),var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px -18px rgba(0,0,0,.8)}
.fact{background:var(--sunk);border:1px solid rgba(255,255,255,.04)}
.fact small{color:var(--muted)}
.lr{background:var(--sunk)}
.lr.me{box-shadow:inset 0 0 0 2px var(--gold);background:rgba(245,181,51,.1)}
.lr .pz{color:var(--gold)}
.hold{background:rgba(255,107,94,.12);border-color:rgba(255,107,94,.5);color:#FFB4AC}
.ok{background:rgba(70,213,138,.12);border-color:rgba(70,213,138,.45);color:#9EF0C4}
.phase span{background:var(--sunk);color:var(--muted)}
.phase span.on{background:rgba(245,181,51,.16);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--gold)}
.phase span.done{color:var(--good)}
.chip{background:var(--sunk)}
.bbtxt{color:var(--brass)}

/* tabs */
.tabs{background:#0B2229;border-top:1px solid rgba(95,199,209,.2)}
.tabs button{font:800 .7rem var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:#E6EEF0;gap:4px;padding:9px 4px 11px}
.tabs button svg{width:26px;height:26px}
.tabs button b{font:inherit}
.tabs button[aria-current="page"]{color:var(--gold)}
.demofab{position:fixed;right:max(12px,calc(50% - 268px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;border:1px dashed rgba(255,255,255,.35);background:rgba(11,34,41,.9);color:var(--muted);font:800 .62rem var(--font-display);letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:999px}

/* lobby */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:6px 16px 18px;text-align:center;color:#fff;
  background:radial-gradient(120% 80% at 50% 0%,rgba(245,181,51,.22),rgba(245,181,51,0) 55%),linear-gradient(180deg,#145564 0%,#0D3540 70%,#0B2A33 100%);
  box-shadow:inset 0 0 0 2px rgba(245,181,51,.55),0 20px 40px -20px rgba(0,0,0,.9)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 18%,rgba(255,217,120,.07) 0 7deg,transparent 7deg 18deg);pointer-events:none}
.hero > *{position:relative}
.hero h1{font-size:1.9rem;margin:4px 0 6px;text-transform:uppercase;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45))}
.hero p{margin:0 auto;max-width:34ch;font-size:.92rem;color:#D7E6E9}
.hero .lineup{margin:6px 0 10px}
.themetag{background:var(--gold-grad);color:var(--felt-ink);font:800 .74rem var(--font-display);text-transform:uppercase;letter-spacing:.06em;box-shadow:0 4px 12px -4px rgba(0,0,0,.6)}
.upside{margin:14px 0 14px}
.upside div{background:rgba(5,22,28,.55);border:1px solid rgba(245,181,51,.35)}
.upside b{color:var(--gold-hi);font:900 1.5rem var(--font-data)}
.upside small{color:#CFE0E3}
.lineup .lp.win{border-color:var(--gold)}
.lineup .lp em{background:var(--gold-grad)}
.ticker{overflow:hidden;margin:0 -16px;padding:0 0 2px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tk{display:flex;gap:8px;width:max-content;animation:tick 38s linear infinite}
.tw{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px 6px 6px}
.tw img{width:40px;height:40px;border-radius:8px;object-fit:cover}
.tw b{display:block;font:700 .8rem var(--font-display)}.tw small{display:block;color:var(--muted);font-size:.72rem;line-height:1.1}.tw em{display:block;font:900 1rem var(--font-data);color:var(--gold);font-style:normal}
@keyframes tick{to{transform:translateX(-50%)}}
.strip button{background:var(--surface);border-color:var(--line);color:var(--fg)}
.strip .today{background:var(--gold-grad);color:var(--felt-ink);border-color:var(--gold)}.strip .today small,.strip .today i{color:var(--felt-ink)}
.strip button[aria-pressed="true"]:not(.today){box-shadow:inset 0 0 0 2px var(--brass)}
.dayline{background:var(--surface);border-color:var(--line)}
.dayline .link{color:var(--brass)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:4px}
.tile{position:relative;border:0;background:none;padding:0 0 4px;display:flex;flex-direction:column;align-items:center;color:var(--fg)}
.tile .art{position:relative;width:100%;aspect-ratio:1;max-width:118px;border-radius:50%;overflow:hidden;display:grid;place-items:center;box-shadow:inset 0 0 0 3px rgba(245,181,51,.55),0 10px 22px -10px rgba(0,0,0,.9);background:radial-gradient(circle at 50% 30%,#1E6A79,#0C2B34 70%)}
.tile .tl{position:relative;margin-top:-18px;z-index:2;width:100%;background:var(--gold-grad);color:#4A2C00;font:900 .7rem/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.04em;padding:9px 4px;border-radius:999px;box-shadow:0 3px 0 #A86400}
.tile .badge{position:absolute;top:2px;right:8%;z-index:3;min-width:26px;height:26px;padding:0 6px;border-radius:8px;display:grid;place-items:center;background:#C2272D;color:#fff;font:900 .82rem var(--font-display);font-style:normal;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.tile .badge.time{top:-2px;right:auto;left:50%;transform:translateX(-50%);height:auto;padding:4px 8px;border-radius:10px;background:#0B2229;border:1.5px solid var(--gold);font:800 .56rem/1.15 var(--font-display);letter-spacing:.06em;text-align:center;white-space:nowrap}
.art.vs img{position:absolute;width:46%;height:62%;object-fit:cover;border-radius:8px;border:2px solid #fff;top:16%}
.art.vs img:first-of-type{left:6%;transform:rotate(-8deg)}.art.vs img:last-of-type{right:6%;transform:rotate(8deg)}
.art.vs b{position:relative;z-index:2;background:#0B2229;color:var(--gold);font:900 .7rem var(--font-display);padding:5px 6px;border-radius:999px;border:1.5px solid var(--gold);margin-top:-12%}
.art.trophy svg{width:62%;height:62%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.art.flag i{width:56%;height:42%;border-radius:4px;background:conic-gradient(#111 25%,#fff 0 50%,#111 0 75%,#fff 0) 0 0/25% 33.4%;box-shadow:0 0 0 3px #fff,0 8px 16px rgba(0,0,0,.5);transform:rotate(-8deg)}
.fine{text-align:center;font-size:.72rem;color:var(--muted);margin:2px 0 0}

/* judging */
.judgecard{background:radial-gradient(120% 70% at 50% 0%,rgba(95,199,209,.18),rgba(95,199,209,0) 60%),var(--surface);border-color:rgba(95,199,209,.45)}
.vsbig{position:relative;display:flex;justify-content:center;align-items:center;padding:8px 0 4px}
.vsbig img{width:116px;height:146px;object-fit:cover;border-radius:12px;border:3px solid #fff;box-shadow:0 12px 24px -10px rgba(0,0,0,.8)}
.vsbig img:first-child{transform:rotate(-6deg)}.vsbig img:last-of-type{transform:rotate(6deg)}
.vsbig b{z-index:2;margin:0 -14px;background:#0B2229;color:var(--gold);border:2px solid var(--gold);font:900 .9rem var(--font-display);padding:8px 9px;border-radius:999px}
.vsbig em{position:absolute;top:0;right:calc(50% - 132px);background:var(--teal-grad);color:#04252B;font:900 .78rem var(--font-data);font-style:normal;padding:4px 10px;border-radius:999px;transform:rotate(8deg);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.duel button{border-radius:16px}
.flybb{background:var(--teal-grad);color:#04252B}
.bbwin{background:rgba(95,199,209,.12);border-color:rgba(95,199,209,.5)}.bbwin b{color:var(--brass)}
.minivs b{background:#0B2229;color:var(--gold)}

/* derby betting */
.segA button,.tiers button{background:var(--sunk);border-color:var(--line);color:var(--fg);font-family:var(--font-display);font-weight:800}
.segA button[aria-pressed="true"]{background:rgba(245,181,51,.16);box-shadow:inset 0 0 0 2px var(--gold)}
.tiers small{color:var(--brass)}
.tiers button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--gold);background:rgba(245,181,51,.12)}
.field button{background:var(--sunk);border-color:var(--line);color:var(--fg)}
.field button[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.field span em{color:var(--gold)}
.stakes button{background:var(--sunk);border-color:var(--line);color:var(--fg)}
.stakes button[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.roll button{background:var(--sunk);border-color:var(--line)}
.roll button[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
.toast{background:#0B2229;color:var(--fg);border:1.5px solid var(--gold);font-weight:700}

/* overlays */
.ovl{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(3,14,18,.82);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .2s ease-out}
.ovl[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.cel{position:relative;overflow:hidden;width:min(100%,380px);max-height:calc(100dvh - 32px);overflow-y:auto;text-align:center;padding:26px 20px 18px;border-radius:26px;
  background:radial-gradient(120% 70% at 50% 0%,rgba(245,181,51,.28),rgba(245,181,51,0) 60%),linear-gradient(180deg,#145564,#0B2A33);box-shadow:inset 0 0 0 2px var(--gold),0 30px 80px -20px rgba(0,0,0,.9);animation:popin .45s cubic-bezier(.2,1.4,.4,1)}
.cel.quiet{background:linear-gradient(180deg,#12404B,#0B2A33);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2),0 30px 80px -20px rgba(0,0,0,.9)}
@keyframes popin{from{transform:scale(.7);opacity:0}}
.cel .rays{position:absolute;left:50%;top:120px;width:640px;height:640px;margin:-320px 0 0 -320px;background:repeating-conic-gradient(rgba(255,217,120,.16) 0 9deg,transparent 9deg 22deg);animation:spin 18s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.cel .cf{position:absolute;top:-16px;width:8px;height:13px;border-radius:2px;animation:fall 2.6s ease-in infinite;pointer-events:none}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(560px) rotate(540deg);opacity:.2}}
.cel > *:not(.rays):not(.cf){position:relative}
.celph{width:150px;height:170px;margin:4px auto 0}
.celph img{width:100%;height:100%;object-fit:cover;border-radius:18px;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--gold),0 18px 30px -10px rgba(0,0,0,.7)}
.cel.quiet .celph img{box-shadow:0 0 0 3px rgba(255,255,255,.7),0 18px 30px -10px rgba(0,0,0,.7)}
.celbadge{position:absolute;right:-18px;bottom:-16px;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font:900 1.25rem/1 var(--font-display);color:#4A2C00;background:radial-gradient(circle at 35% 30%,#FFF3B0,#F5B533 58%,#D98A06);box-shadow:0 0 0 4px #fff,0 8px 18px -6px rgba(0,0,0,.6);animation:pulse 1.6s ease-in-out infinite}
.cel.quiet .celbadge{background:#0B2229;color:var(--fg);box-shadow:0 0 0 3px rgba(255,255,255,.6);animation:none}
@keyframes pulse{50%{transform:scale(1.08)}}
.cel h2{margin:26px 0 6px;font:900 2.1rem/1 var(--font-display);text-transform:uppercase;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.cel.quiet h2{background:none;color:#fff;filter:none;font-size:1.7rem}
.celamt{margin:2px 0;font:900 2rem/1.1 var(--font-data);color:var(--gold-hi);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.celamt.bb{color:#9BE7EE;font-size:1.6rem}
.celtx{margin:8px 0 16px;color:#D7E6E9;font-size:.95rem;line-height:1.45}.celtx b{color:#fff}
.cel .link{display:block;margin:8px auto 0;color:#CFE0E3}
.how h2{margin-top:4px}
.steps{list-style:none;counter-reset:s;margin:6px 0 16px;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:2px 10px;align-items:start}
.steps li::before{content:counter(s);grid-row:span 2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold-grad);color:#4A2C00;font:900 1rem var(--font-display)}
.steps b{font-family:var(--font-display);font-weight:800}.steps span{font-size:.86rem;color:#CFE0E3}
.sheeto{place-items:end center;padding:0}
.sheet{width:min(100%,560px);background:#0F3540;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;box-shadow:0 -20px 50px rgba(0,0,0,.6);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40%)}}

/* the race */
.raceo{padding:10px}
.race{width:min(100%,560px);max-height:calc(100dvh - 20px);display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:24px;background:linear-gradient(180deg,#145564,#0B2A33);box-shadow:inset 0 0 0 2px var(--gold),0 30px 80px -20px rgba(0,0,0,.9)}
.rhead{text-align:center}
.rhead h2{font:900 1.5rem var(--font-display);text-transform:uppercase;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.call{margin:6px 0 0;min-height:2.6em;display:flex;align-items:center;justify-content:center;font:800 1rem/1.3 var(--font-display);color:#fff;background:rgba(5,22,28,.6);border:1px solid rgba(245,181,51,.35);border-radius:12px;padding:6px 10px}
.rtrack{position:relative;border-radius:16px;padding:8px 10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 12.5%),linear-gradient(180deg,#2F7D3E,#24652F);box-shadow:inset 0 0 0 3px #E8D9B5,inset 0 0 30px rgba(0,0,0,.35)}
.lane{position:relative;height:52px;border-bottom:2px dashed rgba(255,255,255,.28)}
.lane:last-of-type{border-bottom:0}
.rtrack.tight .lane{height:40px}
.run{position:absolute;inset:0 44px 0 0}
.horse{--p:0;position:absolute;top:50%;left:calc(var(--p) * 100%);transform:translate(0,-50%);width:44px;height:44px;will-change:left}
.rtrack.tight .horse{width:34px;height:34px}
.horse img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:2.5px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.45)}
.horse b{position:absolute;left:-8px;top:-6px;min-width:18px;height:18px;padding:0 3px;border-radius:5px;display:grid;place-items:center;font:900 .66rem var(--font-display);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.horse.me img{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,181,51,.55),0 4px 12px rgba(0,0,0,.5)}
.horse.pick img{border-color:var(--brass)}
.horse em{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);background:var(--gold-grad);color:#4A2C00;font:900 .5rem var(--font-display);letter-spacing:.06em;padding:2px 5px;border-radius:999px;font-style:normal;white-space:nowrap}
.horse em.pk{background:var(--teal-grad);color:#04252B}
.horse .plc{position:absolute;right:-30px;top:50%;transform:translateY(-50%);font:900 .72rem var(--font-display);font-style:normal;padding:3px 6px;border-radius:999px;background:#fff;color:#0A1F27;animation:popin .4s cubic-bezier(.2,1.4,.4,1)}
.horse .plc.p1{background:var(--gold-grad);color:#4A2C00}
.gate{position:absolute;top:6px;bottom:6px;left:8px;width:3px;background:rgba(255,255,255,.55);border-radius:2px}
.finish{position:absolute;top:6px;bottom:6px;right:10px;width:12px;border-radius:2px;background:conic-gradient(#111 25%,#fff 0 50%,#111 0 75%,#fff 0) 0 0/12px 12px}
.rtrack.done .horse:not(:has(.p1)){opacity:.75}
.rfoot{text-align:center}
.rfoot .link{color:#CFE0E3}
@media (max-width:360px){.brand{font-size:1rem}.wallet{grid-template-columns:1fr 1fr}.btn.dep{grid-column:span 2;min-height:38px}.hero h1{font-size:1.6rem}.tile .tl{font-size:.6rem}}
@media (prefers-reduced-motion:reduce){.tk,.cel .rays,.cel .cf,.celbadge{animation:none}.cel .cf{display:none}}
.pill .coin,.pill.cashp .coin,.pill.bb .coin{display:grid!important}
.pill.bb .coin{color:#5A3300}
.wallet{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) auto;gap:6px}
.pill{font-size:.9rem;padding:4px 10px 4px 4px;gap:6px}
.btn.dep{padding:6px 12px;font-size:.78rem;min-height:38px}
@media (max-width:420px){.pill small{display:none}}

.snd{position:absolute;top:10px;right:10px;z-index:5;width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);background:rgba(5,22,28,.6);font-size:1rem;line-height:1;display:grid;place-items:center;padding:0}
.rhead{position:relative}
.rhead .snd{top:-4px;right:-4px}

.est{background:rgba(5,22,28,.55);border:1px solid rgba(245,181,51,.35);border-radius:14px;padding:10px 12px;margin:0 0 12px;text-align:center}
.est span{display:block;font-size:.8rem;color:var(--muted)}
.est div{display:flex;justify-content:center;align-items:baseline;gap:10px;margin:2px 0}
.est b{font:900 1.45rem var(--font-data);color:var(--gold-hi)}.est b.bbtxt{color:var(--brass);font-size:1.2rem}
.est i{font-style:normal;color:var(--muted);font-size:.8rem}
.est small{display:block;font-size:.72rem;color:var(--muted)}
.est.muted{color:var(--muted);font-size:.85rem;border-style:dashed}


.lp{max-width:480px;margin:0 auto;padding:14px 16px 90px;display:flex;flex-direction:column;gap:14px}
.lp .bar{position:static;border:0;background:none;padding:4px 0 0}
.adcard{background:#fff;color:#13222A;border-radius:16px;overflow:hidden;box-shadow:0 14px 40px -20px rgba(0,0,0,.9)}
.adh{display:flex;gap:10px;align-items:center;padding:12px}
.adh i{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE9A3,#F5B533 60%,#C77C02);display:grid;place-items:center;font:900 .8rem var(--font-display);color:#5A3300;font-style:normal}
.adh b{display:block;font-size:.92rem}.adh small{color:#6B7C83;font-size:.76rem}
.adt{padding:0 12px 10px;font-size:.92rem;line-height:1.4}
.adimg{background:radial-gradient(120% 70% at 50% 0%,rgba(245,181,51,.25),rgba(245,181,51,0) 60%),linear-gradient(180deg,#145564,#0B2A33);padding:12px}
.adimg h3{margin:0 0 8px;text-align:center;font:900 1.2rem var(--font-display);text-transform:uppercase;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.adf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:#F2F4F5}
.adf span{font-size:.78rem;color:#4B5B62}.adf button{border:0;border-radius:8px;background:#E2E6E8;color:#13222A;font:700 .88rem var(--font-body);padding:9px 14px}
.adnote{text-align:center;font-size:.74rem;color:var(--muted)}
.pg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pg button{position:relative;padding:0;border:2px solid transparent;border-radius:12px;overflow:hidden;background:var(--sunk);aspect-ratio:1}
.pg img{width:100%;height:100%;object-fit:cover;display:block}
.pg b{position:absolute;left:5px;top:5px;min-width:20px;height:20px;padding:0 4px;border-radius:5px;display:grid;place-items:center;font:900 .7rem var(--font-display);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.pg button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,181,51,.35)}
.pg button[aria-pressed="true"]::after{content:"Your pick";position:absolute;left:0;right:0;bottom:0;background:var(--gold-grad);color:#3A2200;font:900 .66rem var(--font-display);text-transform:uppercase;padding:3px 0;text-align:center}
.pg.small button{border-width:1px}
.hd{text-align:center}.hd h1{font-size:1.7rem;text-transform:uppercase;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}.hd p{margin:4px 0 0;color:var(--muted)}
.picked{display:flex;gap:12px;align-items:center}
.picked img{width:84px;height:84px;object-fit:cover;border-radius:14px;box-shadow:0 0 0 3px var(--gold)}
.picked h2{margin:0;font-size:1.3rem}.picked p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.split div{display:grid;grid-template-columns:30px 1fr 40px;gap:8px;align-items:center;margin:6px 0;font:700 .82rem var(--font-data)}
.split img{width:30px;height:30px;border-radius:6px;object-fit:cover}
.split span{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}.split u{display:block;height:100%;background:var(--brass);border-radius:5px}
.split .me u{background:var(--gold)}
.field2 label{display:block;font:700 .8rem var(--font-display);margin:0 0 6px}
.field2 input[type=text]{width:100%;border-radius:12px;border:1.5px solid var(--line);background:var(--sunk);color:var(--fg);font:500 1rem var(--font-body);padding:12px 14px}
.field2 input[type=text]:focus{outline:none;border-color:var(--gold)}
.tick{display:flex;gap:10px;align-items:flex-start;font-size:.84rem;color:#CFE0E3;line-height:1.4;cursor:pointer}
.tick input{width:20px;height:20px;margin:1px 0 0;accent-color:#F5B533;flex:none}
.err{color:#FFB4AC;font-size:.82rem;margin:0}
.fine2{font-size:.72rem;color:var(--muted);line-height:1.4;margin:0}
.big{font:900 2rem var(--font-data);color:var(--gold-hi);text-align:center}
.phone2{background:#E9EEF0;color:#13222A;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 50px -20px rgba(0,0,0,.9)}
.phone2 .from{font:700 .78rem var(--font-body);color:#6B7C83;text-align:center}
.bub{background:#fff;border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:.92rem;line-height:1.4;max-width:92%}
.bub a{color:#0A6E7A;font-weight:700}
.podium{display:flex;gap:8px;justify-content:center;align-items:flex-end;padding:8px 0}
.podium div{position:relative;width:86px;text-align:center}
.podium img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block;box-shadow:0 8px 16px rgba(0,0,0,.4)}
.podium .p1{width:110px}.podium .mine img{box-shadow:0 0 0 3px var(--gold),0 8px 16px rgba(0,0,0,.4)}
.podium b{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--gold-grad);color:#3A2200;font:900 .72rem var(--font-display);padding:2px 8px;border-radius:999px}
.podium small{display:block;margin-top:4px;font:700 .74rem var(--font-display)}

function runRace({ title, sub, field, order, me, picks = [], onDone }) {

    else if (t < .45) call(`${nameOf(a.id, a.no)} takes the early lead`);

      <button class="link" data-act="change">Change my pick</button></div>`;
  if (S.step === 'skipped') return `${bar()}<div class="card" style="text-align:center"><h2>Your pick is saved on this device</h2><p class="note">Come back after 8pm to see how #${no(S.pick)} did.</p><button class="link" data-act="back">Actually, send me the result</button></div>`;
  if (S.step === 'sms') return `<p class="adnote">8:02pm. This is the message they get.</p>
    <div class="phone2"><p class="from">Shutter Stakes</p>
      <div class="bub">🏁 The Best Pet Derby is in! ${S.result.place === 1 ? `<b>Your pick #${no(S.pick)} WON!</b>` : `Your pick #${no(S.pick)} came <b>${ord(S.result.place)}</b>.`} See the photo finish: <a href="#" data-act="toResult">Watch the replay ›</a></div>
      <div class="bub">Tomorrow is 🍳 Food. Free picks open at 5pm.<br><small style="color:#6B7C83">Reply STOP to unsubscribe.</small></div></div>`;
  if (S.step === 'result') { const R = S.result.order;
    return `${bar()}<div class="hd"><p class="eyebrow">🐾 Best Pet Derby · Result</p><h1>${S.result.place === 1 ? 'You called it!' : `#${no(R[0])} wins!`}</h1></div>
      <div class="card"><div class="podium">${[1, 0, 2].map(k => `<div class="${k === 0 ? 'p1' : ''} ${R[k] === S.pick ? 'mine' : ''}"><b>${ord(k + 1)}</b><img src="${img(R[k])}" alt="#${no(R[k])}"><small>#${no(R[k])}${R[k] === S.pick ? ' · yours' : ''}</small></div>`).join('')}</div>
      <p class="note" style="text-align:center">Your pick #${no(S.pick)} finished <b>${ord(S.result.place)}</b> of 9.</p>
      <button class="btn ghost block" data-act="replay">Watch the replay</button></div>
      <div class="card judgecard" style="text-align:center"><h2>Back your pick for real tomorrow</h2><p class="note">Join Shutter Stakes to race your own photos and bet on the 8pm Derby. ${S.mkt ? 'New players get 25,000 BBs to start.' : ''}</p>
      <button class="btn cash block" data-act="join">Join Shutter Stakes</button><button class="link" data-act="remind">Just remind me about tomorrow</button></div>`; }
}
function render() { $('#lp').innerHTML = view(); window.scrollTo(0, 0); }
function runDerby(after) {
  const w = FIELD.map(() => Math.random() + .2), order = FIELD.slice().sort((a, b) => w[FIELD.indexOf(b)] - w[FIELD.indexOf(a)]);
  S.result = { order, place: order.indexOf(S.pick) + 1 };
  if (after) after();
}
function replay() {
  const R = S.result.order;
  runRace({ title: 'Best Pet Derby', sub: '8pm · 🐾 Pets', field: FIELD, order: R, me: null, picks: [S.pick], onDone: () => {
    const p = S.result.place;
    if (p === 1) celebrate({ src: img(S.pick), badge: '1st', title: 'You called it!', text: `#${no(S.pick)} ${esc(byId[S.pick].title)} won the Best Pet Derby. Only ${SHARE[FIELD.indexOf(S.pick)]}% of people picked it.`, cta: 'Join and bet tomorrow', act: 'join', later: 'Back to the result', laterAct: 'closeOvl' });
    else celebrate({ quiet: p > 3, src: img(S.pick), badge: ord(p), title: p <= 3 ? 'So close!' : 'Not this time', text: `Your pick finished ${ord(p)}. #${no(R[0])} ${esc(byId[R[0]].title)} won. Tomorrow is 🍳 Food.`, cta: 'Join and bet tomorrow', act: 'join', later: 'Back to the result', laterAct: 'closeOvl' });
  } });
}
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2600); }
function openDemo() { openOvl(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Demo controls"><p class="eyebrow">Demo controls</p>
  ${S.pick ? '<button class="btn block" data-act="eight">Skip to 8pm · send the reveal</button>' : '<p class="note">Make a pick first.</p>'}
  <button class="btn ghost block" data-act="sound">Sound: ${SND.on ? 'on' : 'off'}</button>
  <button class="btn ghost block" data-act="restart">Start over from the ad</button>
  <p class="note">Simulated: nothing is sent and no details are stored.</p><button class="link" data-act="closeOvl">Close</button></div>`, 'sheeto'); }
document.addEventListener('input', e => { if (e.target.id === 'ct') S.contact = e.target.value; });
document.addEventListener('change', e => { if (e.target.id === 'age') S.age = e.target.checked; if (e.target.id === 'mkt') S.mkt = e.target.checked; if (S.err && e.target.id === 'age' && S.age) { S.err = ''; const x = document.querySelector('.err'); if (x) x.remove(); } });
document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return; const d = t.dataset;
  if (t.tagName === 'A') e.preventDefault();
  if (t.closest('#ovl') && d.act && d.act !== 'closeOvl' && d.act !== 'sound') closeOvl();
  if (d.pick) { S.pick = d.pick; render(); const b = document.querySelector('[data-act="lock"]'); if (b) b.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
  const a = d.act; if (!a) return;
  if (a === 'toPick') { S.step = 'pick'; render(); }
  else if (a === 'lock') { chime(); S.step = 'save'; render(); }
  else if (a === 'save') { const v = S.contact.trim(), ok = /@.+\./.test(v) || v.replace(/\D/g, '').length >= 10;
    S.err = !ok ? 'Enter an email or a 10-digit mobile number.' : !S.age ? 'Please confirm you’re 19 or older and in Ontario.' : '';
    if (S.err) { render(); return; } S.step = 'saved'; render(); toast('Saved. See you at 8pm'); }
  else if (a === 'skip') { S.step = 'skipped'; render(); }
  else if (a === 'back') { S.step = 'save'; render(); }
  else if (a === 'change') { S.step = 'pick'; render(); }
  else if (a === 'eight') { runDerby(() => { S.step = S.contact ? 'sms' : 'result'; render(); }); }
  else if (a === 'toResult') { S.step = 'result'; render(); replay(); }
  else if (a === 'replay') replay();
  else if (a === 'join') toast('Opens casino sign-up');
  else if (a === 'remind') toast('We’ll remind you at 5pm tomorrow');
  else if (a === 'demo') openDemo();
  else if (a === 'restart') { S = { step: 'ad', pick: null, contact: '', err: '', age: false, mkt: false, result: null }; render(); }
  else if (a === 'closeOvl') closeOvl();
  else if (a === 'sound') { setSound(!SND.on); document.querySelectorAll('.snd').forEach(b => { b.setAttribute('aria-pressed', SND.on); b.textContent = SND.on ? '🔊' : '🔇'; }); }
});
render();
})();
</script>
